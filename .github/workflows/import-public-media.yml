name: Import public Island Braids Instagram media
on:
  push:
    paths:
      - "scripts/import_instagram_media.py"
      - ".github/workflows/import-public-media.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public media helpers
        run: |
          python -m pip install --disable-pip-version-check --quiet yt-dlp instaloader pillow requests
      - name: Fetch and verify public Island Braids posts
        run: python scripts/import_instagram_media.py
      - name: Save fetched media assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/instagram
          if git diff --cached --quiet; then
            echo "No new verified media to commit"
          else
            git commit -m "Import verified public Island Braids social media assets"
            git push
          fi
      - name: Summarize import
        if: always()
        run: |
          echo "## Public Island Braids media import" >> "$GITHUB_STEP_SUMMARY"
          if [ -f assets/instagram/manifest.json ]; then
            echo '\`\`\`json' >> "$GITHUB_STEP_SUMMARY"
            cat assets/instagram/manifest.json >> "$GITHUB_STEP_SUMMARY"
            echo '\`\`\`' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Importer did not write a manifest." >> "$GITHUB_STEP_SUMMARY"
          fi
