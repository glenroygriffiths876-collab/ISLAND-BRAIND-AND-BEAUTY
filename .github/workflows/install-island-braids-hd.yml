name: Install full-quality Island Braids images
on:
  push:
    branches: [main]
    paths:
      - '.staging/hd/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct and verify original images
        run: |
          set -euo pipefail
          cat .staging/hd/*.b64 | base64 --decode > /tmp/island-braids-images.zip
          echo '91069a69b238a3379ff73e7293cbf00731cd56e7de8511763390b699688a2e2b  /tmp/island-braids-images.zip' | sha256sum --check
          unzip -o /tmp/island-braids-images.zip 'assets/images/*' -d .
          rm -rf .staging/hd
          rmdir .staging || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all assets/images .staging
          if ! git diff --cached --quiet; then
            git commit -m 'Install original high-definition Island Braids photographs'
            git push
          fi
